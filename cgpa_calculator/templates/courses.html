<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Courses for {{ program }}</h1>
    <form action="/calculate" method="post">
        <input type="hidden" name="program" value="{{ program }}">
        <table>
            <thead>
                <tr>
                    <th>Course Code</th>
                    <th>Course Title</th>
                    <th>Credit</th>
                    <th>Grade Point (GP)</th>
                </tr>
            </thead>
            <tbody>
                {% for course in courses %}
                <tr>
                    <td>
                        <input type="hidden" name="course_code" value="{{ course.code }}">
                        {{ course.code }}
                    </td>
                    <td>{{ course.title }}</td>
                    <td>
                        <input type="number" step="0.01" name="credit" value="{{ course.credit }}" required>
                    </td>
                    <td>
                        <input type="number" step="0.01" name="gp" placeholder="Enter GP" required>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <button type="submit">Calculate CGPA</button>
    </form>
    <a href="/">Go Back</a>
</body>
</html>
